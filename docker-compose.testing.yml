services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.testing
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - composer-cache:/tmp/composer
      - node-modules:/var/www/html/node_modules
    ports:
      - "127.0.0.1:5173:5173"
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: baskito_testing
      DB_USERNAME: baskito
      DB_PASSWORD: baskito
      CACHE_STORE: array
      CACHE_DRIVER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      COMPOSER_CACHE_DIR: /tmp/composer
    depends_on:
      db:
        condition: service_healthy
    command: tail -f /dev/null

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: baskito_testing
      MYSQL_USER: baskito
      MYSQL_PASSWORD: baskito
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - testing-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  composer-cache:
  testing-db:
  vendor:
  node-modules:
